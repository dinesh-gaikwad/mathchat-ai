services:
  - type: web
    name: mathchat-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn -w 1 app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///mathchat.db
      - key: CORS_ORIGINS
        value: "*"
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini

  - type: web
    name: mathchat-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_SOCKET_URL
        value: https://mathchat-ai-backend.onrender.com
      - key: REACT_APP_API_URL
        value: https://mathchat-ai-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
